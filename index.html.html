<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2027 수능완성 영어 단어암기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Lora:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F2; --bg2:#EAECE7; --surface:#FFFFFF;
  --border:#D8DDD3; --border2:#BEC5B7;
  --ink:#1A1C18; --ink2:#454840; --ink3:#7A7E73; --ink4:#AEAFA8;
  --gr:#2E7D52; --gr-lt:#E8F5EE; --gr-md:#C3E6D2;
  --teal:#1A7A6E; --teal-lt:#E0F4F0;
  --amber:#B8720E; --amber-lt:#FEF4E2;
  --r:14px; --r-sm:9px;
  --sh:0 1px 8px rgba(0,0,0,.07);
  --sh-lg:0 4px 24px rgba(0,0,0,.10);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
.shell{max-width:860px;margin:0 auto;padding:0 18px 80px;}

/* HEADER */
.header{display:flex;align-items:center;gap:12px;padding:26px 0 0;}
.badge{background:var(--gr);color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.4px;padding:5px 11px;border-radius:6px;white-space:nowrap;}
.header h1{font-family:'Lora',serif;font-size:clamp(17px,3.2vw,24px);color:var(--ink);letter-spacing:-.2px;}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin:20px 0 26px;}
.tab{padding:10px 20px 12px;border:none;background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;}
.tab.on{color:var(--gr);border-bottom-color:var(--gr);font-weight:700;}
.tab:hover:not(.on){color:var(--ink2);}
.panel{display:none;} .panel.on{display:block;}

/* SELECT */
.sec-label{font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--ink4);text-transform:uppercase;margin-bottom:11px;}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px;}
.chip{padding:6px 15px;border:1.5px solid var(--border2);background:var(--surface);color:var(--ink2);border-radius:50px;font-size:12.5px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .14s;white-space:nowrap;}
.chip:hover{border-color:var(--gr);color:var(--gr);background:var(--gr-lt);}
.chip.g{border-color:var(--teal);color:var(--teal);}
.chip.g:hover{background:var(--teal-lt);}
.chip.r{border-color:#B84040;color:#B84040;}
.chip.r:hover{background:#FDEAEA;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin-bottom:30px;}
.ucard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 14px 12px;cursor:pointer;transition:border-color .14s,background .14s,transform .15s,box-shadow .15s;position:relative;overflow:hidden;user-select:none;}
.ucard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gr);transform:scaleX(0);transform-origin:left;transition:transform .18s;}
.ucard:hover{border-color:var(--gr-md);transform:translateY(-2px);box-shadow:var(--sh);}
.ucard:hover::before{transform:scaleX(.4);}
.ucard.sel{border-color:var(--gr);background:var(--gr-lt);box-shadow:var(--sh);}
.ucard.sel::before{transform:scaleX(1);}
.unum{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:var(--ink4);margin-bottom:5px;}
.ucard.sel .unum{color:var(--gr);}
.uname{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:7px;word-break:keep-all;}
.uwc{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink4);}
.ucard.sel .uwc{color:var(--gr);}
.chk{position:absolute;top:10px;right:10px;width:17px;height:17px;background:var(--gr);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;opacity:0;transform:scale(.5);transition:opacity .14s,transform .14s;}
.ucard.sel .chk{opacity:1;transform:scale(1);}

/* UNIT 구분 레이블 */
.section-divider{grid-column:1/-1;padding:8px 4px 4px;font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:var(--ink4);text-transform:uppercase;border-top:1.5px solid var(--border);margin-top:4px;}
.section-divider:first-child{border-top:none;margin-top:0;}

/* START BAR */
.startbar{position:sticky;bottom:0;padding:14px 0 20px;background:linear-gradient(to top,var(--bg) 72%,transparent);display:flex;align-items:center;gap:18px;}
.wstat{text-align:center;min-width:60px;}
.wsn{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;color:var(--gr);line-height:1;}
.wsl{font-size:11px;color:var(--ink4);margin-top:2px;}
.dvd{width:1px;height:32px;background:var(--border);}
.btn-start{flex:1;padding:14px 20px;background:var(--gr);border:none;border-radius:var(--r);color:#fff;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:background .14s,transform .14s,box-shadow .14s;box-shadow:0 3px 14px rgba(46,125,82,.28);}
.btn-start:hover{background:#23653F;transform:translateY(-1px);box-shadow:0 5px 18px rgba(46,125,82,.36);}
.btn-start:disabled{background:var(--bg2);color:var(--ink4);cursor:not-allowed;box-shadow:none;transform:none;}

/* QUIZ */
.quiz-wrap{display:flex;flex-direction:column;min-height:calc(100vh - 160px);}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.qctr{display:flex;align-items:baseline;gap:4px;}
.qcur{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;color:var(--ink);}
.qsep,.qtot{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink4);}
.btn-stop{padding:6px 15px;border:1.5px solid var(--border2);background:transparent;color:var(--ink3);border-radius:8px;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .14s;}
.btn-stop:hover{border-color:#B04040;color:#B04040;background:#FDEAEA;}
.prog-track{height:5px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gr),var(--amber));border-radius:10px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* CARD */
.card-area{flex:1;display:flex;align-items:center;justify-content:center;}
.card{width:100%;max-width:640px;background:var(--surface);border:1.5px solid var(--border);border-radius:22px;padding:36px 40px 32px;text-align:center;box-shadow:var(--sh-lg);position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gr),var(--amber));transform:scaleX(0);transform-origin:left;transition:transform .5s ease;}
.card.rev::after{transform:scaleX(1);}
.unit-pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:50px;padding:5px 14px;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.4px;margin-bottom:22px;font-family:'JetBrains Mono',monospace;}
.pill-dot{width:6px;height:6px;background:var(--gr);border-radius:50%;}
.timer-area{display:flex;justify-content:center;margin-bottom:18px;}
.timer-wrap{position:relative;width:50px;height:50px;}
.t-svg{transform:rotate(-90deg);display:block;}
.t-bg{fill:none;stroke:var(--border);stroke-width:3.5;}
.t-arc{fill:none;stroke:var(--gr);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:132;stroke-dashoffset:0;transition:stroke-dashoffset .12s linear,stroke .3s;}
.t-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;color:var(--ink);}
.card-en{font-family:'Lora',serif;font-size:clamp(26px,5.5vw,46px);font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.3px;margin-bottom:18px;min-height:50px;display:flex;align-items:center;justify-content:center;}
.card-rule{width:32px;height:2px;background:var(--border2);margin:0 auto 16px;border-radius:2px;transition:background .3s,width .3s;}
.card-rule.lit{background:var(--gr);width:52px;}
.card-ko{font-size:clamp(17px,3.8vw,25px);font-weight:700;color:var(--gr);min-height:30px;opacity:0;transform:translateY(5px);transition:opacity .32s,transform .32s;word-break:keep-all;}
.card-ko.show{opacity:1;transform:translateY(0);}

/* ACTIONS */
.actions{display:flex;gap:10px;margin-top:20px;max-width:640px;margin-left:auto;margin-right:auto;width:100%;}
.btn-act{flex:1;padding:13px 14px;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;transition:all .14s;border:1.5px solid transparent;}
.btn-reveal{background:var(--teal-lt);color:var(--teal);border-color:var(--teal);}
.btn-reveal:hover{background:var(--teal);color:#fff;}
.btn-next{background:var(--gr);color:#fff;box-shadow:0 2px 10px rgba(46,125,82,.26);}
.btn-next:hover{background:#23653F;transform:translateY(-1px);}

/* DONE */
.done{display:none;flex-direction:column;align-items:center;text-align:center;padding:56px 20px 36px;gap:16px;}
.done.show{display:flex;}
.done-icon{width:68px;height:68px;background:var(--amber-lt);border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;}
.done-title{font-family:'Lora',serif;font-size:30px;color:var(--ink);}
.done-sub{font-size:15px;color:var(--ink3);line-height:1.9;}
.done-sub strong{color:var(--ink);}
.done-btns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
.btn-done{padding:12px 30px;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;transition:all .14s;}
.btn-done.pri{background:var(--gr);color:#fff;border:none;box-shadow:0 2px 10px rgba(46,125,82,.26);}
.btn-done.pri:hover{background:#23653F;}
.btn-done.gho{background:transparent;color:var(--ink2);border:1.5px solid var(--border2);}
.btn-done.gho:hover{border-color:var(--gr);color:var(--gr);background:var(--gr-lt);}

/* LIST TAB */
.list-topbar{position:sticky;top:0;background:var(--bg);padding:4px 0 14px;z-index:10;}
.list-unit-row{display:flex;gap:7px;flex-wrap:wrap;}
.list-chip{padding:6px 14px;border:1.5px solid var(--border2);background:var(--surface);color:var(--ink2);border-radius:50px;font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .14s;white-space:nowrap;}
.list-chip:hover{border-color:var(--gr);color:var(--gr);background:var(--gr-lt);}
.list-chip.on{background:var(--gr);color:#fff;border-color:var(--gr);}
.list-empty{text-align:center;padding:60px 20px;color:var(--ink4);font-size:15px;}
.list-section{margin-bottom:36px;}
.list-section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.list-section-badge{background:var(--gr);color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:5px;}
.list-section-name{font-family:'Lora',serif;font-size:17px;font-weight:700;color:var(--ink);}
.list-section-cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink4);margin-left:auto;}
.word-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);}
.word-table th{background:var(--bg2);font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--ink4);text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1.5px solid var(--border);}
.word-table th:first-child{width:40px;text-align:center;}
.word-table th:nth-child(2){width:40%;}
.word-table td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px;}
.word-table tr:last-child td{border-bottom:none;}
.word-table tr:hover td{background:var(--gr-lt);}
.word-table td:first-child{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink4);}
.word-table td:nth-child(2){font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:var(--ink);}
.word-table td:nth-child(3){color:var(--ink2);font-weight:500;word-break:keep-all;line-height:1.5;}

/* ANIMS */
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.card.anim{animation:cardIn .28s cubic-bezier(.4,0,.2,1) forwards;}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);}.card{padding:26px 18px 22px;}.word-table td{padding:8px 10px;font-size:12.5px;}}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr);}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <span class="badge">EBS 2027</span>
    <h1>수능완성 영어 단어암기</h1>
  </header>

  <nav class="tabs">
    <button class="tab on" onclick="goTab('sel')">단원 선택</button>
    <button class="tab"    onclick="goTab('quiz')">암기 카드</button>
    <button class="tab"    onclick="goTab('list')">단어표</button>
  </nav>

  <!-- SELECT -->
  <div class="panel on" id="p-sel">
    <p class="sec-label">빠른 선택</p>
    <div class="chips">
      <button class="chip g" onclick="chAll()">✓ 전체 선택</button>
      <button class="chip r" onclick="chNone()">✕ 전체 해제</button>
      <button class="chip"   onclick="chKeys(['Ch01','Ch02','Ch03','Ch04','Ch05','Ch06'])">유형편 Ch01~06</button>
      <button class="chip"   onclick="chKeys(['Ch07','Ch08','Ch09','Ch10','Ch11','Ch12','Ch13'])">유형편 Ch07~13</button>
      <button class="chip"   onclick="chKeys(['실전1','실전2','실전3','실전4','실전5'])">실전편 1~5회</button>
    </div>
    <p class="sec-label">단원 목록 <span id="selLbl" style="color:var(--gr);font-size:11px;margin-left:6px;"></span></p>
    <div class="grid" id="ugrid"></div>
    <div class="startbar">
      <div class="wstat"><div class="wsn" id="wnum">0</div><div class="wsl">단어</div></div>
      <div class="dvd"></div>
      <button class="btn-start" id="btnStart" onclick="startQuiz()" disabled>암기 시작하기 →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="panel" id="p-quiz">
    <div class="quiz-wrap" id="quizMain">
      <div class="qtop">
        <div class="qctr">
          <span class="qcur" id="qCur">1</span>
          <span class="qsep">/</span>
          <span class="qtot" id="qTot">0</span>
        </div>
        <button class="btn-stop" onclick="stopQuiz()">✕ 중단</button>
      </div>
      <div class="prog-track"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
      <div class="card-area">
        <div class="card" id="fcard">
          <div class="unit-pill"><span class="pill-dot"></span><span id="pillLbl">Ch01</span></div>
          <div class="timer-area">
            <div class="timer-wrap">
              <svg class="t-svg" width="50" height="50" viewBox="0 0 50 50">
                <circle class="t-bg" cx="25" cy="25" r="21"/>
                <circle class="t-arc" id="tArc" cx="25" cy="25" r="21"/>
              </svg>
              <div class="t-num" id="tNum">3</div>
            </div>
          </div>
          <div class="card-en" id="cEn">—</div>
          <div class="card-rule" id="cRule"></div>
          <div class="card-ko"  id="cKo">뜻</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-act btn-reveal" onclick="doReveal()">👁 바로 보기</button>
        <button class="btn-act btn-next"   onclick="nextCard()">다음 단어 →</button>
      </div>
    </div>
    <div class="done" id="doneBox">
      <div class="done-icon">🎉</div>
      <div class="done-title">완주!</div>
      <div class="done-sub">총 <strong id="doneCnt">0</strong>개 단어 완료<br>선택 단원: <strong id="doneUnits">—</strong></div>
      <div class="done-btns">
        <button class="btn-done pri" onclick="restartQuiz()">🔄 다시 암기</button>
        <button class="btn-done gho" onclick="goBack()">← 단원 선택</button>
      </div>
    </div>
  </div>

  <!-- LIST -->
  <div class="panel" id="p-list">
    <div class="list-topbar">
      <div class="list-unit-row" id="listUnitRow"></div>
    </div>
    <div id="listContent">
      <div class="list-empty">← 위에서 단원을 선택하세요</div>
    </div>
  </div>
</div>

/* ── 메타 정보 ── */
const UNIT_KEYS = ["Ch01","Ch02","Ch03","Ch04","Ch05","Ch06","Ch07","Ch08","Ch09","Ch10","Ch11","Ch12","Ch13","실전1","실전2","실전3","실전4","실전5"];
const IS_SILJON = k => k.startsWith("실전");

/* ── STATE ── */
let sel = new Set();
let deck = [], idx = 0, timer = null, tSec = 3, revealed = false;
const CIRCUM = 132;

/* ── BUILD GRID ── */
function buildGrid(){
  const g = document.getElementById('ugrid');
  g.innerHTML = '';

  let lastGroup = '';
  UNIT_KEYS.forEach(k => {
    const group = IS_SILJON(k) ? '실전편' : '유형편';
    if(group !== lastGroup){
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.textContent = group;
      g.appendChild(div);
      lastGroup = group;
    }
    const u = UNITS[k];
    const d = document.createElement('div');
    d.className = 'ucard';
    d.id = 'uc-'+k;
    d.onclick = () => toggleUnit(k);
    d.innerHTML = `<div class="unum">${k}</div><div class="uname">${u.name}</div><div class="uwc">${u.words.length}단어</div><div class="chk">✓</div>`;
    g.appendChild(d);
  });
}

function toggleUnit(k){
  if(sel.has(k)) sel.delete(k); else sel.add(k);
  document.getElementById('uc-'+k).classList.toggle('sel', sel.has(k));
  updateCount();
}

function chAll(){ UNIT_KEYS.forEach(k=>{ sel.add(k); document.getElementById('uc-'+k).classList.add('sel'); }); updateCount(); }
function chNone(){ sel.clear(); UNIT_KEYS.forEach(k=>document.getElementById('uc-'+k).classList.remove('sel')); updateCount(); }
function chKeys(keys){
  chNone();
  keys.forEach(k=>{ sel.add(k); document.getElementById('uc-'+k).classList.add('sel'); });
  updateCount();
}

function updateCount(){
  let t=0; sel.forEach(k=>{ t+=UNITS[k].words.length; });
  document.getElementById('wnum').textContent = t;
  document.getElementById('selLbl').textContent = sel.size+'개 단원 선택됨';
  document.getElementById('btnStart').disabled = sel.size===0;
}

/* ── QUIZ ── */
function startQuiz(){
  deck=[];
  UNIT_KEYS.filter(k=>sel.has(k)).forEach(k=>{
    UNITS[k].words.forEach(([en,ko])=>deck.push({en,ko,unit:k}));
  });
  shuffle(deck); idx=0;
  const unitList = UNIT_KEYS.filter(k=>sel.has(k)).join(', ');
  document.getElementById('qTot').textContent = deck.length;
  document.getElementById('doneCnt').textContent = deck.length;
  document.getElementById('doneUnits').textContent = unitList;
  document.getElementById('quizMain').style.display='flex';
  document.getElementById('doneBox').classList.remove('show');
  goTab('quiz'); showCard();
}

function showCard(){
  if(idx>=deck.length){ endQuiz(); return; }
  revealed=false; clearInterval(timer);
  const w=deck[idx];
  document.getElementById('qCur').textContent=idx+1;
  document.getElementById('pFill').style.width=(idx/deck.length*100)+'%';
  document.getElementById('pillLbl').textContent=w.unit+' · '+UNITS[w.unit].name;
  document.getElementById('cEn').textContent=w.en;
  document.getElementById('cKo').textContent=w.ko;
  document.getElementById('cKo').classList.remove('show');
  document.getElementById('cRule').classList.remove('lit');
  document.getElementById('fcard').classList.remove('rev');
  const card=document.getElementById('fcard');
  card.classList.remove('anim'); void card.offsetWidth; card.classList.add('anim');
  startTimer();
}

function startTimer(){
  tSec=3; updateTimer(3);
  document.getElementById('tArc').style.stroke='var(--gr)';
  timer=setInterval(()=>{
    tSec--;
    updateTimer(tSec);
    if(tSec<=1) document.getElementById('tArc').style.stroke='#B04040';
    if(tSec<=0){ clearInterval(timer); reveal(); }
  },1000);
}
function updateTimer(s){
  const s0=Math.max(0,s);
  document.getElementById('tArc').style.strokeDashoffset=CIRCUM-(s0/3)*CIRCUM;
  document.getElementById('tNum').textContent=s0;
}
function reveal(){
  clearInterval(timer); revealed=true;
  document.getElementById('cKo').classList.add('show');
  document.getElementById('cRule').classList.add('lit');
  document.getElementById('fcard').classList.add('rev');
  updateTimer(0);
}
function doReveal(){ if(!revealed) reveal(); }
function nextCard(){ idx++; showCard(); }
function stopQuiz(){ clearInterval(timer); goTab('sel'); }
function endQuiz(){
  clearInterval(timer);
  document.getElementById('quizMain').style.display='none';
  document.getElementById('doneBox').classList.add('show');
  document.getElementById('pFill').style.width='100%';
}
function restartQuiz(){ shuffle(deck); idx=0; document.getElementById('quizMain').style.display='flex'; document.getElementById('doneBox').classList.remove('show'); showCard(); }
function goBack(){ clearInterval(timer); goTab('sel'); }

/* ── LIST TAB ── */
let listUnit = null;
function renderListTab(){
  const row = document.getElementById('listUnitRow');
  row.innerHTML='';

  // 전체
  const allChip = document.createElement('button');
  allChip.className='list-chip'+(listUnit===null?' on':'');
  allChip.textContent='전체';
  allChip.onclick=()=>{ listUnit=null; renderListTab(); };
  row.appendChild(allChip);

  // 구분선 레이블 (유형편/실전편)
  ['유형편','실전편'].forEach(section=>{
    const label = document.createElement('span');
    label.style.cssText='font-size:10px;color:var(--ink4);align-self:center;padding:0 4px;';
    label.textContent='|';
    row.appendChild(label);

    UNIT_KEYS.filter(k=> section==='유형편' ? !IS_SILJON(k) : IS_SILJON(k)).forEach(k=>{
      const chip = document.createElement('button');
      chip.className='list-chip'+(listUnit===k?' on':'');
      chip.textContent=k;
      chip.onclick=()=>{ listUnit=k; renderListTab(); };
      row.appendChild(chip);
    });
  });

  // 테이블
  const content=document.getElementById('listContent');
  const unitsToShow = listUnit===null ? UNIT_KEYS : [listUnit];
  content.innerHTML='';
  unitsToShow.forEach(k=>{
    const u=UNITS[k];
    const section=document.createElement('div');
    section.className='list-section';
    const titleRow=document.createElement('div');
    titleRow.className='list-section-title';
    titleRow.innerHTML=`<span class="list-section-badge">${k}</span><span class="list-section-name">${u.name}</span><span class="list-section-cnt">${u.words.length}단어</span>`;
    section.appendChild(titleRow);
    const table=document.createElement('table');
    table.className='word-table';
    table.innerHTML='<thead><tr><th>#</th><th>영어</th><th>뜻</th></tr></thead>';
    const tbody=document.createElement('tbody');
    u.words.forEach(([en,ko],i)=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${i+1}</td><td>${en}</td><td>${ko}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    section.appendChild(table);
    content.appendChild(section);
  });
}

/* ── TABS ── */
function goTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>
    b.classList.toggle('on',(i===0&&t==='sel')||(i===1&&t==='quiz')||(i===2&&t==='list')));
  document.getElementById('p-sel').classList.toggle('on',t==='sel');
  document.getElementById('p-quiz').classList.toggle('on',t==='quiz');
  document.getElementById('p-list').classList.toggle('on',t==='list');
  if(t==='list') renderListTab();
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

/* ── INIT ── */
buildGrid(); updateCount();
</script>
